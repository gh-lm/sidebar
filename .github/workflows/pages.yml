name: Publish privacy page
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The date the CONTENT last changed, taken from the last commit that
      # touched site/. Not the build time: a deploy that changed nothing
      # should not claim the page is newer than it is.
      # The date the CONTENT last changed, from the last commit touching
      # site/. Not the build time: a deploy that changed nothing should not
      # claim the page is newer than it is.
      - name: Stamp the last-updated date
        run: python3 tools/stamp-date.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
