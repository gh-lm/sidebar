<meta charset="utf-8">
<title>shot</title>
<style>
  @font-face {
    font-family: Manrope;
    src: url("/app/fonts/Manrope.woff2") format("woff2");
    font-weight: 200 800; font-display: block;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    background: #0e1524; font-family: Manrope, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.light { background: #f4f2ec; }
  .bar { position: absolute; inset: 0 0 auto 0; height: 6px; background: #FBC711; }
  .copy { position: absolute; left: 88px; top: 268px; width: 620px; }
  h1 {
    margin: 0 0 22px; font-weight: 300; font-size: 46px; line-height: 1.18;
    letter-spacing: -0.015em; color: #f3f5f9;
  }
  p { margin: 0; font-weight: 300; font-size: 19px; line-height: 1.55; color: #9aa6bd; }
  body.light h1 { color: #111827; }
  body.light p { color: #4b5563; }
  .panel {
    position: absolute; top: 40px; right: 72px; width: 430px; height: 720px;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
  }
  body.light .panel { box-shadow: 0 40px 90px rgba(17,24,39,.22), 0 0 0 1px rgba(17,24,39,.08); }
  iframe { width: 430px; height: 720px; border: 0; display: block; }
</style>
<div class="bar"></div>
<div class="copy"><h1 id="h"></h1><p id="s"></p></div>
<div class="panel"><iframe id="f" src="about:blank"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("h").innerHTML = (q.get("h") || "").replace(/\|/g, "<br>");
  document.getElementById("s").innerHTML = (q.get("s") || "").replace(/\|/g, "<br>");
  if (q.get("light") === "1") document.body.classList.add("light");
  document.getElementById("f").src = "/app/sidebar/sidebar.html?" + (q.get("p") || "");
</script>
